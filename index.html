<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok Connected</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 32px 16px; }
  main { max-width: 640px; margin: 0 auto; }
  textarea { width: 100%; height: 120px; background: #222; color: #eee; border: 1px solid #444; padding: 8px; }
  button { margin-top: 8px; padding: 10px 16px; font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>TikTok authorized</h1>
  <p>Copy this whole address and paste it back to Claude:</p>
  <textarea id="u" readonly></textarea>
  <button onclick="navigator.clipboard.writeText(document.getElementById('u').value)">Copy</button>
</main>
<script>document.getElementById('u').value = location.href;</script>
</body>
</html>
